name: Hardening branch TDD

on:
  push:
    branches:
      - release-build-hardening-2026-11-02

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test metadata hardening
        shell: pwsh
        run: ./tests/Hardening/Test-Metadata.ps1

      - name: Test package hardening
        shell: pwsh
        run: ./tests/Hardening/Test-Packages.ps1
