name: Hardening branch TDD

on:
  push:
    branches:
      - release-build-hardening-2026-11-02

permissions:
  contents: read

concurrency:
  group: hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test metadata hardening
        shell: pwsh
        run: ./tests/Hardening/Test-Metadata.ps1

      - name: Test package hardening
        shell: pwsh
        run: ./tests/Hardening/Test-Packages.ps1

      - name: Test Pages metadata rendering
        shell: pwsh
        run: ./tests/Hardening/Test-Pages.ps1

      - name: Render actual website
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/render-pages.ps1 -Root $PWD.Path -OutputDir (Join-Path $PWD.Path '_site-test')
          $html = Get-Content _site-test/index.html -Raw -Encoding UTF8
          foreach ($expected in @(
            '0.1.95-swyf',
            'CzechSpeechEnhanced · v1.4.0',
            'CzechTTSFix · v1.0.0',
            'CzechTranslationFix · v1.0.3'
          )) {
            if (-not $html.Contains($expected)) { throw "Rendered production website is missing: $expected" }
          }
          if ($html -match '__[A-Z0-9_]+__') { throw "Rendered production website contains unresolved placeholder: $($Matches[0])" }

  self_hosted_build:
    uses: ./.github/workflows/build-mods-reusable.yml
    with:
      artifact_name: swyf-hardening-branch-${{ github.run_id }}
