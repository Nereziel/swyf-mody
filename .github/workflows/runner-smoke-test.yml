name: Runner smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: [self-hosted, Linux, X64, swyf]
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check runner tools
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          dotnet --version
          pwsh --version

      - name: Check mounted game libraries
        shell: bash
        run: |
          set -euxo pipefail
          test -f "/game/Scam With Your Friends_Data/Managed/ScriptsAssDef.dll"
          test -f "/game/Scam With Your Friends_Data/Managed/UnityEngine.dll"
          test -f "/game/Scam With Your Friends_Data/Managed/UnityEngine.CoreModule.dll"
          test -f "/game/Scam With Your Friends_Data/Managed/Newtonsoft.Json.dll"
          test -f "/game/Scam With Your Friends_Data/Managed/MetaVoiceChat.Core.dll"
          test -f "/game/Scam With Your Friends_Data/Managed/Kolkata.Speech.dll"
          test -f "/game/Scam With Your Friends_Data/Managed/com.whisper.unity.dll"
          test -f "/game/Scam With Your Friends_Data/Managed/Unity.Localization.dll"
          test -f "/game/BepInEx/core/BepInEx.dll"
          test -f "/game/BepInEx/core/0Harmony.dll"
          echo "Runner environment and mounted DLLs are ready."
