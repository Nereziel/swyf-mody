name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'gameversion.txt'
      - 'src/SpeechEnhanced/mod.json'
      - 'src/CzechTTSFix/mod.json'
      - 'src/CzechTranslationFix/mod.json'
      - 'tools/render-pages.ps1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Render website metadata
        shell: pwsh
        run: |
          ./tools/render-pages.ps1 -Root $PWD.Path -OutputDir (Join-Path $PWD.Path '_site')
          if ($LASTEXITCODE -ne 0) { throw "Website metadata rendering failed." }

      - name: Upload website
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
