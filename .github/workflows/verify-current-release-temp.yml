name: Verify current release packages temp

on:
  push:
    branches:
      - release-build-hardening-2026-11-02
    paths:
      - '.github/workflows/verify-current-release-temp.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download current release packages
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          base='https://github.com/Nereziel/swyf-mody/releases/download/v2026.11.02-0.1.95'
          curl --fail --location --retry 3 "$base/CzechSpeechEnhanced-1.4.0.swyfmod" -o dist/CzechSpeechEnhanced-1.4.0.swyfmod
          curl --fail --location --retry 3 "$base/CzechTTSFix-1.0.0.swyfmod" -o dist/CzechTTSFix-1.0.0.swyfmod
          curl --fail --location --retry 3 "$base/CzechTranslationFix-1.0.3.swyfmod" -o dist/CzechTranslationFix-1.0.3.swyfmod

      - name: Verify current release package contents
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/verify-packages.ps1 -Root $PWD.Path -Dist (Join-Path $PWD.Path 'dist')
