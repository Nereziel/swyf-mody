name: Update current release description

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-current-release-description.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Update release description
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v2026.11.02-0.1.95
        run: |
          $ErrorActionPreference = 'Stop'
          $gameVersion = (Get-Content gameversion.txt -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($gameVersion)) { throw 'gameversion.txt is empty.' }

          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'swyf-release-description-update'
          }
          $repoApi = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY"
          $encodedTag = [Uri]::EscapeDataString($env:RELEASE_TAG)
          $release = Invoke-RestMethod -Method Get -Uri "$repoApi/releases/tags/$encodedTag" -Headers $headers

          $lines = @($release.body -split "`r?`n")
          if ($lines.Count -eq 0) { throw 'Release body is empty.' }
          $lines[0] = "**Poslední ověřená verze hry:** ``$gameVersion``"
          $body = $lines -join "`n"

          $payload = @{
            body = $body
          } | ConvertTo-Json

          Invoke-RestMethod -Method Patch -Uri "$repoApi/releases/$($release.id)" -Headers $headers -ContentType 'application/json' -Body $payload | Out-Null
          Write-Host "Updated release $env:RELEASE_TAG with game version $gameVersion."
