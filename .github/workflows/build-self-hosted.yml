name: Build mods on self-hosted runner

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, swyf]
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify mounted game libraries
        shell: bash
        run: |
          set -euxo pipefail
          test -f "/game/Scam With Your Friends_Data/Managed/ScriptsAssDef.dll"
          test -f "/game/BepInEx/core/BepInEx.dll"

      - name: Build all public mods
        shell: pwsh
        run: |
          ./build-package.ps1 -GameDir "/game" -Mod All

      - name: List packages
        shell: bash
        run: |
          set -euxo pipefail
          ls -lah dist
          find dist -maxdepth 1 -type f -name '*.swyfmod' -print

      - name: Upload mod packages
        uses: actions/upload-artifact@v4
        with:
          name: swyf-mod-packages
          path: dist/*.swyfmod
          if-no-files-found: error
