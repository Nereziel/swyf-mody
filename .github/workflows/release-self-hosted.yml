name: Build and release mods

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Společný release tag, např. v2026.11.01"
        required: true
        type: string
      version_bump:
        description: "SemVer zvýšení vybraných modů"
        required: true
        default: none
        type: choice
        options:
          - none
          - patch
          - minor
          - major
      bump_speech:
        description: "Zvýšit verzi CzechSpeechEnhanced"
        required: false
        default: false
        type: boolean
      bump_tts:
        description: "Zvýšit verzi CzechTTSFix"
        required: false
        default: false
        type: boolean
      bump_translation:
        description: "Zvýšit verzi CzechTranslationFix"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Označit jako prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: swyf-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.bump.outputs.commit_sha }}

    steps:
      - name: Checkout requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Bump selected mod versions
        id: bump
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          BUMP_KIND: ${{ inputs.version_bump }}
          BUMP_SPEECH: ${{ inputs.bump_speech }}
          BUMP_TTS: ${{ inputs.bump_tts }}
          BUMP_TRANSLATION: ${{ inputs.bump_translation }}
          REF_TYPE: ${{ github.ref_type }}
          BRANCH: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'

          $tag = $env:RELEASE_TAG.Trim()
          if ([string]::IsNullOrWhiteSpace($tag)) { throw 'Release tag is empty.' }

          $bump = $env:BUMP_KIND.Trim().ToLowerInvariant()
          if ($bump -notin @('none', 'patch', 'minor', 'major')) {
            throw "Unsupported version bump: $bump"
          }

          $selected = [ordered]@{
            'src/SpeechEnhanced/mod.json' = $env:BUMP_SPEECH -eq 'true'
            'src/CzechTTSFix/mod.json' = $env:BUMP_TTS -eq 'true'
            'src/CzechTranslationFix/mod.json' = $env:BUMP_TRANSLATION -eq 'true'
          }
          $selectedPaths = @($selected.GetEnumerator() | Where-Object Value | ForEach-Object Key)

          if ($bump -eq 'none') {
            if ($selectedPaths.Count -gt 0) {
              throw 'A mod is selected for version bump, but version_bump is none.'
            }
            $sha = (git rev-parse HEAD).Trim()
            "commit_sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Version bump disabled; building commit $sha."
            exit 0
          }

          if ($env:REF_TYPE -ne 'branch' -or $env:BRANCH -ne 'main') {
            throw 'Automatic version bump is allowed only when the workflow is dispatched from the main branch.'
          }
          if ($selectedPaths.Count -eq 0) {
            throw 'Select at least one mod when version_bump is patch, minor, or major.'
          }

          function Get-StatusCode($record) {
            if ($record.Exception.Response -and $record.Exception.Response.StatusCode) {
              return [int]$record.Exception.Response.StatusCode
            }
            return 0
          }

          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'swyf-release-workflow'
          }
          $repoApi = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY"
          $encodedTag = [Uri]::EscapeDataString($tag)
          try {
            $existingTag = Invoke-RestMethod -Method Get -Uri "$repoApi/git/ref/tags/$encodedTag" -Headers $headers
            throw "Tag $tag already exists at $($existingTag.object.sha). Refusing to bump versions."
          }
          catch {
            if ((Get-StatusCode $_) -ne 404) { throw }
          }

          function Get-BumpedVersion([string]$Version, [string]$Kind) {
            if ($Version -notmatch '^(\d+)\.(\d+)\.(\d+)$') {
              throw "Version '$Version' is not SemVer major.minor.patch."
            }

            [long]$major = $Matches[1]
            [long]$minor = $Matches[2]
            [long]$patch = $Matches[3]
            switch ($Kind) {
              'patch' { $patch++ }
              'minor' { $minor++; $patch = 0 }
              'major' { $major++; $minor = 0; $patch = 0 }
              default { throw "Unsupported version bump: $Kind" }
            }
            return "$major.$minor.$patch"
          }

          foreach ($path in $selectedPaths) {
            $text = [IO.File]::ReadAllText($path)
            $manifest = $text | ConvertFrom-Json
            $oldVersion = [string]$manifest.version
            $newVersion = Get-BumpedVersion $oldVersion $bump

            $pattern = '(?m)(^\s*"version"\s*:\s*")' + [regex]::Escape($oldVersion) + '("\s*,?\s*$)'
            $regex = [regex]::new($pattern)
            if ($regex.Matches($text).Count -ne 1) {
              throw "Could not uniquely locate version $oldVersion in $path."
            }

            $updated = $regex.Replace($text, '${1}' + $newVersion + '${2}', 1)
            [IO.File]::WriteAllText($path, $updated, [Text.UTF8Encoding]::new($false))
            Write-Host "${path}: $oldVersion -> $newVersion"
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $selectedPaths
          git commit -m "chore: bump mod versions ($bump)"
          if ($LASTEXITCODE -ne 0) { throw 'Version bump commit failed.' }

          git push origin "HEAD:$env:BRANCH"
          if ($LASTEXITCODE -ne 0) { throw 'Version bump push failed. The branch may have changed; rerun the release workflow.' }

          $sha = (git rev-parse HEAD).Trim()
          "commit_sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Version bump committed as $sha."

  build:
    needs: version
    runs-on: [self-hosted, Linux, X64, swyf]
    timeout-minutes: 30
    outputs:
      commit_sha: ${{ steps.metadata.outputs.commit_sha }}
      speech_version: ${{ steps.metadata.outputs.speech_version }}
      tts_version: ${{ steps.metadata.outputs.tts_version }}
      translation_version: ${{ steps.metadata.outputs.translation_version }}
      game_version: ${{ steps.metadata.outputs.game_version }}

    steps:
      - name: Checkout versioned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.commit_sha }}
          persist-credentials: false

      - name: Capture build metadata
        id: metadata
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          $speech = (Get-Content src/SpeechEnhanced/mod.json -Raw | ConvertFrom-Json).version
          $tts = (Get-Content src/CzechTTSFix/mod.json -Raw | ConvertFrom-Json).version
          $translation = (Get-Content src/CzechTranslationFix/mod.json -Raw | ConvertFrom-Json).version
          $gameVersion = (Get-Content gameversion.txt -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($gameVersion)) { throw 'gameversion.txt is empty.' }
          "commit_sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "speech_version=$speech" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tts_version=$tts" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "translation_version=$translation" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "game_version=$gameVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Verify mounted game libraries
        shell: bash
        run: |
          set -euxo pipefail
          test -f "/game/Scam With Your Friends_Data/Managed/ScriptsAssDef.dll"
          test -f "/game/BepInEx/core/BepInEx.dll"

      - name: Test CzechSpeechEnhanced audio processing
        shell: pwsh
        run: |
          dotnet run --project tests/SpeechEnhanced/SpeechEnhanced.Tests.csproj
          if ($LASTEXITCODE -ne 0) { throw "CzechSpeechEnhanced tests failed." }

      - name: Test Parakeet selection and switching
        shell: pwsh
        run: |
          dotnet run --project tests/SpeechMenu
          if ($LASTEXITCODE -ne 0) { throw "Parakeet menu tests failed." }

      - name: Test CzechTranslationFix parser
        shell: pwsh
        run: |
          dotnet run --project tests/CzechTranslationFix -- localization/original/en-cs.json src/CzechTranslationFix
          if ($LASTEXITCODE -ne 0) { throw "CzechTranslationFix tests failed." }

      - name: Build all public mods
        shell: pwsh
        run: |
          Remove-Item -LiteralPath dist -Recurse -Force -ErrorAction SilentlyContinue
          ./build-package.ps1 -GameDir "/game" -Mod All
          if ($LASTEXITCODE -ne 0) { throw "Build failed." }

      - name: Verify three packages
        shell: pwsh
        run: |
          $expected = @(
            "CzechSpeechEnhanced-${{ steps.metadata.outputs.speech_version }}.swyfmod",
            "CzechTTSFix-${{ steps.metadata.outputs.tts_version }}.swyfmod",
            "CzechTranslationFix-${{ steps.metadata.outputs.translation_version }}.swyfmod"
          )
          $actual = @(Get-ChildItem dist -Filter '*.swyfmod' -File)
          if ($actual.Count -ne 3) { throw "Expected 3 public packages, found $($actual.Count)." }
          foreach ($name in $expected) {
            if (-not (Test-Path (Join-Path dist $name))) { throw "Missing package: $name" }
            Write-Host "OK: $name"
          }

      - name: Save build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swyf-mod-packages-${{ inputs.tag }}
          path: dist/*.swyfmod
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: swyf-mod-packages-${{ inputs.tag }}
          path: dist

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          BUILD_SHA: ${{ needs.build.outputs.commit_sha }}
          SPEECH_VERSION: ${{ needs.build.outputs.speech_version }}
          TTS_VERSION: ${{ needs.build.outputs.tts_version }}
          TRANSLATION_VERSION: ${{ needs.build.outputs.translation_version }}
          GAME_VERSION: ${{ needs.build.outputs.game_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG.Trim()
          if ([string]::IsNullOrWhiteSpace($tag)) { throw 'Release tag is empty.' }
          if ([string]::IsNullOrWhiteSpace($env:GAME_VERSION)) { throw 'Game version is empty.' }

          function Get-StatusCode($record) {
            if ($record.Exception.Response -and $record.Exception.Response.StatusCode) {
              return [int]$record.Exception.Response.StatusCode
            }
            return 0
          }

          $files = @(Get-ChildItem dist -Filter '*.swyfmod' -File)
          if ($files.Count -ne 3) { throw "Expected 3 downloaded packages, found $($files.Count)." }

          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'swyf-release-workflow'
          }
          $repoApi = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY"
          $prerelease = $env:PRERELEASE -eq 'true'
          $encodedTag = [Uri]::EscapeDataString($tag)

          $tagRef = $null
          try {
            $tagRef = Invoke-RestMethod -Method Get -Uri "$repoApi/git/ref/tags/$encodedTag" -Headers $headers
          }
          catch {
            if ((Get-StatusCode $_) -ne 404) { throw }
          }

          if ($tagRef) {
            $tagObject = $tagRef.object
            while ($tagObject.type -eq 'tag') {
              $annotated = Invoke-RestMethod -Method Get -Uri $tagObject.url -Headers $headers
              $tagObject = $annotated.object
            }
            if ($tagObject.sha -ne $env:BUILD_SHA) {
              throw "Tag $tag points to $($tagObject.sha), but this build is $env:BUILD_SHA. Use a new release tag."
            }
            Write-Host "Tag $tag matches build commit $env:BUILD_SHA."
          }

          $title = "SWYF CZ/SK mody $tag"
          $body = @(
            "**Ověřeno pro verzi hry:** ``$env:GAME_VERSION``"
            ''
            '## Balíčky'
            ''
            "- **CzechSpeechEnhanced $env:SPEECH_VERSION** – lepší CZ/SK přepis řeči přes Parakeet"
            "- **CzechTTSFix $env:TTS_VERSION** – oprava českého Pocket TTS"
            "- **CzechTranslationFix $env:TRANSLATION_VERSION** – oprava české lokalizace"
            ''
            '## Instalace'
            ''
            'Stáhni požadovaný `.swyfmod` a nainstaluj ho přes SWYF Mod Hub.'
            ''
            '> Tyto mody nejsou kompatibilní s modem **Lepší čeština**. Nepoužívej je současně.'
          ) -join "`n"

          $release = $null
          try {
            $release = Invoke-RestMethod -Method Get -Uri "$repoApi/releases/tags/$encodedTag" -Headers $headers
            if (-not $tagRef) { throw "Release $tag exists, but its Git tag could not be resolved." }
            Write-Host "Release $tag already exists on the same commit; replacing .swyfmod assets."
          }
          catch {
            $status = Get-StatusCode $_
            if ($status -ne 404) { throw }

            $payload = @{
              tag_name = $tag
              target_commitish = $env:BUILD_SHA
              name = $title
              body = $body
              draft = $false
              prerelease = $prerelease
              generate_release_notes = $true
            } | ConvertTo-Json
            $release = Invoke-RestMethod -Method Post -Uri "$repoApi/releases" -Headers $headers -ContentType 'application/json' -Body $payload
            Write-Host "Created release $tag for $env:BUILD_SHA."
          }

          foreach ($asset in @($release.assets)) {
            if ($asset.name -like '*.swyfmod') {
              Write-Host "Deleting old asset $($asset.name)"
              Invoke-RestMethod -Method Delete -Uri "$repoApi/releases/assets/$($asset.id)" -Headers $headers
            }
          }

          $uploadUrl = $release.upload_url -replace '\{\?name,label\}$', ''
          foreach ($file in $files | Sort-Object Name) {
            $name = $file.Name
            $encodedName = [Uri]::EscapeDataString($name)
            Write-Host "Uploading $name"
            Invoke-RestMethod -Method Post -Uri "${uploadUrl}?name=$encodedName" -Headers $headers -ContentType 'application/octet-stream' -InFile $file.FullName | Out-Null
          }

          Write-Host "Release ready: $($release.html_url)"
